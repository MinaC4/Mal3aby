#
# Blocking threshold is `error` (CI plan: "BLOCKING on errors"). Known warnings
# deferred to Phase 7/9 when images are digest-pinned and rebuilt non-root:
#   DL3025 shell-form HEALTHCHECK CMD (all 3 Dockerfiles)
#   DL3059 consecutive RUN (backend)
#   DL3066 non-numeric USER (backend)
failure-threshold: error
