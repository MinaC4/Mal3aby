apiVersion: v1
kind: ConfigMap
metadata:
  name: malaby-dashboard-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: malaby
data:
  malaby-overview.json: |-
    {
      "title": "Malaby — Overview",
      "uid": "malaby-overview",
      "tags": ["malaby", "overview"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "templating": {"list": [
        {"name": "DS_PROMETHEUS", "type": "datasource", "query": "prometheus", "current": {}}
      ]},
      "panels": [
        {"type":"row","title":"Health","gridPos":{"x":0,"y":0,"w":24,"h":1}},
        {"type":"stat","title":"API targets up","datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"gridPos":{"x":0,"y":1,"w":4,"h":4},
          "targets":[{"expr":"sum(up{namespace=\"malaby-dev\",job=\"api\"})","legendFormat":"up"}],
          "options":{"colorMode":"background","graphMode":"none"},"fieldConfig":{"defaults":{"thresholds":{"steps":[{"color":"red","value":null},{"color":"green","value":1}]}}}},
        {"type":"stat","title":"Ready replicas (all workloads)","datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"gridPos":{"x":4,"y":1,"w":5,"h":4},
          "targets":[{"expr":"sum(kube_deployment_status_replicas_available{namespace=\"malaby-dev\"}) + sum(kube_statefulset_status_replicas_ready{namespace=\"malaby-dev\"})","legendFormat":"ready"}]},
        {"type":"stat","title":"Running pods","datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"gridPos":{"x":9,"y":1,"w":4,"h":4},
          "targets":[{"expr":"count(kube_pod_status_phase{namespace=\"malaby-dev\",phase=\"Running\"}==1)"}]},
        {"type":"stat","title":"Container restarts (total)","datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"gridPos":{"x":13,"y":1,"w":4,"h":4},
          "targets":[{"expr":"sum(kube_pod_container_status_restarts_total{namespace=\"malaby-dev\"})"}],
          "fieldConfig":{"defaults":{"thresholds":{"steps":[{"color":"green","value":null},{"color":"orange","value":3},{"color":"red","value":10}]}}}},
        {"type":"stat","title":"Admin auth failures /min","datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"gridPos":{"x":17,"y":1,"w":4,"h":4},
          "targets":[{"expr":"sum(rate(malaby_admin_auth_failures_total[5m]))*60"}],
          "fieldConfig":{"defaults":{"unit":"reqpm","thresholds":{"steps":[{"color":"green","value":null},{"color":"orange","value":1},{"color":"red","value":10}]}}}},
        {"type":"stat","title":"API request rate","datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"gridPos":{"x":21,"y":1,"w":3,"h":4},
          "targets":[{"expr":"sum(rate(malaby_http_requests_total[5m]))","legendFormat":"rps"}],"fieldConfig":{"defaults":{"unit":"reqps"}}},

        {"type":"row","title":"Traffic & latency","gridPos":{"x":0,"y":5,"w":24,"h":1}},
        {"type":"timeseries","title":"Requests by status","datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"gridPos":{"x":0,"y":6,"w":12,"h":8},
          "targets":[{"expr":"sum by (status) (rate(malaby_http_requests_total[5m]))","legendFormat":"{{status}}"}],
          "fieldConfig":{"defaults":{"unit":"reqps","custom":{"fillOpacity":15,"stacking":{"mode":"normal"}}}}},
        {"type":"timeseries","title":"Latency percentiles","datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"gridPos":{"x":12,"y":6,"w":12,"h":8},
          "targets":[
            {"expr":"histogram_quantile(0.50, sum by (le) (rate(malaby_http_request_duration_seconds_bucket[5m])))","legendFormat":"p50"},
            {"expr":"histogram_quantile(0.95, sum by (le) (rate(malaby_http_request_duration_seconds_bucket[5m])))","legendFormat":"p95"},
            {"expr":"histogram_quantile(0.99, sum by (le) (rate(malaby_http_request_duration_seconds_bucket[5m])))","legendFormat":"p99"}],
          "fieldConfig":{"defaults":{"unit":"s"}}},

        {"type":"row","title":"Pods","gridPos":{"x":0,"y":14,"w":24,"h":1}},
        {"type":"timeseries","title":"Pods by phase","datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"gridPos":{"x":0,"y":15,"w":12,"h":7},
          "targets":[{"expr":"sum by (phase) (kube_pod_status_phase{namespace=\"malaby-dev\"}==1)","legendFormat":"{{phase}}"}]},
        {"type":"table","title":"Restarts by pod","datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"gridPos":{"x":12,"y":15,"w":12,"h":7},
          "targets":[{"expr":"sum by (pod) (kube_pod_container_status_restarts_total{namespace=\"malaby-dev\"})","format":"table","instant":true}],
          "transformations":[{"id":"organize","options":{"excludeByName":{"Time":true}}}],
          "fieldConfig":{"defaults":{"custom":{"cellOptions":{"type":"color-background"}}}}}
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: malaby-dashboard-application
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: malaby
data:
  malaby-application.json: |-
    {
      "title": "Malaby — Application & API",
      "uid": "malaby-application",
      "tags": ["malaby", "api"],
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "templating": {"list": [{"name": "DS_PROMETHEUS", "type": "datasource", "query": "prometheus", "current": {}}]},
      "panels": [
        {"type":"row","title":"Traffic","gridPos":{"x":0,"y":0,"w":24,"h":1}},
        {"type":"timeseries","title":"Request rate by route","datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"gridPos":{"x":0,"y":1,"w":12,"h":8},
          "targets":[{"expr":"sum by (route) (rate(malaby_http_requests_total[5m]))","legendFormat":"{{route}}"}],
          "fieldConfig":{"defaults":{"unit":"reqps","custom":{"fillOpacity":10,"stacking":{"mode":"normal"}}}}},
        {"type":"timeseries","title":"Errors (4xx/5xx) rate","datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"gridPos":{"x":12,"y":1,"w":12,"h":8},
          "targets":[{"expr":"sum(rate(malaby_http_requests_total{status=~\"4..\"}[5m]))","legendFormat":"4xx"},{"expr":"sum(rate(malaby_http_requests_total{status=~\"5..\"}[5m]))","legendFormat":"5xx"}],
          "fieldConfig":{"defaults":{"unit":"reqps"}}},

        {"type":"row","title":"Latency","gridPos":{"x":0,"y":9,"w":24,"h":1}},
        {"type":"timeseries","title":"Request duration p50/p95/p99","datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"gridPos":{"x":0,"y":10,"w":16,"h":8},
          "targets":[
            {"expr":"histogram_quantile(0.50, sum by (le) (rate(malaby_http_request_duration_seconds_bucket[5m])))","legendFormat":"p50"},
            {"expr":"histogram_quantile(0.95, sum by (le) (rate(malaby_http_request_duration_seconds_bucket[5m])))","legendFormat":"p95"},
            {"expr":"histogram_quantile(0.99, sum by (le) (rate(malaby_http_request_duration_seconds_bucket[5m])))","legendFormat":"p99"}],
          "fieldConfig":{"defaults":{"unit":"s"}}},
        {"type":"gauge","title":"Error ratio (5m)","datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"gridPos":{"x":16,"y":10,"w":8,"h":8},
          "targets":[{"expr":"sum(rate(malaby_http_requests_total{status=~\"5..\"}[5m])) / clamp_min(sum(rate(malaby_http_requests_total[5m])),0.0001) * 100"}],
          "fieldConfig":{"defaults":{"unit":"percent","max":100,"thresholds":{"steps":[{"color":"green","value":null},{"color":"orange","value":1},{"color":"red","value":5}]}}}},

        {"type":"row","title":"Admin authentication (security signal)","gridPos":{"x":0,"y":18,"w":24,"h":1}},
        {"type":"timeseries","title":"Unauthenticated admin attempts by reason","datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"gridPos":{"x":0,"y":19,"w":12,"h":8},
          "targets":[{"expr":"sum by (reason) (rate(malaby_admin_auth_failures_total[5m]))","legendFormat":"{{reason}}"}],
          "fieldConfig":{"defaults":{"unit":"reqps"}}},
        {"type":"stat","title":"Total admin auth failures (window)","datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"gridPos":{"x":12,"y":19,"w":12,"h":8},
          "targets":[{"expr":"sum(increase(malaby_admin_auth_failures_total[$__range]))"}]}
      ]
    }
