apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-admin
  namespace: malaby-dev
  labels:
    app: frontend-admin
    app.kubernetes.io/part-of: malaby
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-admin
  template:
    metadata:
      labels:
        app: frontend-admin
        app.kubernetes.io/part-of: malaby
    spec:
      containers:
        - name: nginx
          image: 192.168.1.8:30082/malaby/frontend-admin@sha256:bfb32e1324dbd4df3a350a0714faf70d6d2ec6f9b398a8bc8909ae44cc441be0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-admin
  namespace: malaby-dev
  labels:
    app: frontend-admin
    app.kubernetes.io/part-of: malaby
spec:
  selector:
    app: frontend-admin
  ports:
    - name: http
      port: 80
      targetPort: 80
