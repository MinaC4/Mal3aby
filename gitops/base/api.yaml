apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: malaby-dev
  labels:
    app: api
    app.kubernetes.io/part-of: malaby
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        app.kubernetes.io/part-of: malaby
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: 192.168.1.8:30082/malaby/api@sha256:4e3346e5ecf9a93655c2fc6a4d2796bbc5bab1320a8f2ec5ee2fba22bc36782b
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "5000"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-secrets-eso
                  key: MONGODB_URI
          envFrom:
            - secretRef:
                name: api-secrets-eso
          readinessProbe:
            httpGet: { path: /ready, port: 5000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: malaby-dev
  labels:
    app: api
    app.kubernetes.io/part-of: malaby
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 5000
      targetPort: 5000
