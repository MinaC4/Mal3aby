apiVersion: v1
kind: Pod
metadata:
  name: netpol-test
  namespace: malaby-dev
  labels:
    app: netpol-test
    app.kubernetes.io/part-of: malaby
spec:
  automountServiceAccountToken: false
  containers:
    - name: c
      image: 192.168.1.8:30082/malaby/api@sha256:628c02fe0f29e6de384100d991ec78384317e2188a23e129167675af8273c3cf
      command: ["sh", "-c", "sleep 600"]
      resources:
        requests: { cpu: "10m", memory: "32Mi" }
        limits: { cpu: "100m", memory: "64Mi" }
      readinessProbe: { exec: { command: ["sh", "-c", "true"] } }
      livenessProbe: { exec: { command: ["sh", "-c", "true"] } }
