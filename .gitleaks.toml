title = "malaby gitleaks config"

# Without `useDefault = true` this file REPLACES gitleaks' built-in rule set,
# which silently turns the secret scan into a no-op. Keep it true.
# (Lesson imported from the operator's prior engagement.)
[extend]
useDefault = true

# Allowlist is intentionally tiny and path-based only. Both entries are
# git-ignored local secret files and must never be committed.
# Add a narrow regex only after confirming a real false positive.
[allowlist]
description = "Local-only, git-ignored secret files, raw cluster exports, and Falco output hex ids."
paths = [
  '''\.env$''',
  '''\.env\..+$''',
  '''docs/evidence/pre-engagement/''',
]
# Falco alert lines contain container ids / image digests (hex) that trip generic-api-key.
regexes = [
  '''container_image_tag=[0-9a-f]{64}''',
  '''container_id=[0-9a-f]{64}''',
  # Public container image digest that appeared in an early Falco evidence commit (not a secret).
  '''aba5ee0aa5fd00a2fd8f9dbbf9941ca407bf9e4a1acacd598312666993fd3424''',
]
