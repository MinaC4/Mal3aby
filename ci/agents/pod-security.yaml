apiVersion: v1
kind: Pod
metadata:
  labels:
    app.kubernetes.io/part-of: malaby
    malaby.io/agent: security
spec:
  serviceAccountName: jenkins-agent
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: gitleaks
      image: ghcr.io/gitleaks/gitleaks:v8.28.0
      command: ["sleep", "43200"]
      tty: true
      env:
        - { name: HOME, value: /tmp }
      resources:
        requests: { cpu: "50m", memory: "128Mi" }
        limits: { cpu: "500m", memory: "512Mi" }
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
    - name: semgrep
      image: semgrep/semgrep:1.95.0
      command: ["sleep", "43200"]
      tty: true
      env:
        - { name: HOME, value: /tmp }
      resources:
        requests: { cpu: "50m", memory: "256Mi" }
        limits: { cpu: "500m", memory: "1Gi" }
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
    - name: trivy
      image: aquasec/trivy:0.57.1
      command: ["sleep", "43200"]
      tty: true
      env:
        - { name: HOME, value: /tmp }
        - { name: TRIVY_CACHE_DIR, value: /tmp/trivy-cache }
      resources:
        requests: { cpu: "50m", memory: "256Mi" }
        limits: { cpu: "500m", memory: "1Gi" }
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
    - name: syft
      image: anchore/syft:v1.18.0-debug
      command: ["sleep", "43200"]
      tty: true
      env:
        - { name: HOME, value: /tmp }
      resources:
        requests: { cpu: "50m", memory: "256Mi" }
        limits: { cpu: "500m", memory: "1Gi" }
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
    - name: cosign
      image: bitnami/cosign:sha256-348db85058fc55736357e9f9bc46b6539f910d26674e831c11ae0ee2498a8d03
      command: ["sleep", "43200"]
      tty: true
      env:
        - { name: HOME, value: /tmp }
      volumeMounts:
        - { name: docker-config, mountPath: /tmp/.docker, readOnly: true }
      resources:
        requests: { cpu: "50m", memory: "128Mi" }
        limits: { cpu: "500m", memory: "512Mi" }
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
  volumes:
    - name: docker-config
      secret:
        secretName: harbor-push
        optional: true
