apiVersion: v1
kind: Pod
metadata:
  labels:
    app.kubernetes.io/part-of: malaby
    malaby.io/agent: node
spec:
  serviceAccountName: jenkins-agent
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: node
      image: node:20-alpine
      command: ["sleep", "43200"]
      tty: true
      resources:
        requests: { cpu: "100m", memory: "256Mi" }
        limits: { cpu: "1", memory: "1Gi" }
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
