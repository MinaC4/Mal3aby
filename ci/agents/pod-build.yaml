# Rootless, daemonless image build with Kaniko. No host Docker socket is ever mounted.
apiVersion: v1
kind: Pod
metadata:
  labels:
    app.kubernetes.io/part-of: malaby
    malaby.io/agent: build
spec:
  serviceAccountName: jenkins-agent
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: kaniko
      image: gcr.io/kaniko-project/executor:v1.23.2-debug
      command: ["/busybox/sh", "-c", "sleep 43200"]
      tty: true
      resources:
        requests: { cpu: "200m", memory: "512Mi" }
        limits: { cpu: "2", memory: "2Gi" }
      securityContext:
        # Kaniko must chown the Dockerfile under /kaniko, which requires root.
        # This build pod mounts no host paths; it only writes to the workspace and Harbor.
        # Documented exception — see docs/06-ci-design.md (Phase 9 will revisit in Kyverno).
        allowPrivilegeEscalation: false
        runAsUser: 0
      volumeMounts:
        # Created from the Jenkins credential 'harbor-push' (docker config.json for Harbor).
        - name: docker-config
          mountPath: /kaniko/.docker
          readOnly: true
  volumes:
    - name: docker-config
      secret:
        secretName: harbor-push
        optional: true
