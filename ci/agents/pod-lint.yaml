apiVersion: v1
kind: Pod
metadata:
  labels:
    app.kubernetes.io/part-of: malaby
    malaby.io/agent: lint
spec:
  serviceAccountName: jenkins-agent
  restartPolicy: Never
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: hadolint
      image: hadolint/hadolint:latest
      command: ["sleep", "43200"]
      tty: true
      resources:
        requests: { cpu: "50m", memory: "64Mi" }
        limits: { cpu: "300m", memory: "256Mi" }
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
    - name: yamllint
      image: pipelinecomponents/yamllint:latest
      command: ["sleep", "43200"]
      tty: true
      resources:
        requests: { cpu: "50m", memory: "64Mi" }
        limits: { cpu: "300m", memory: "256Mi" }
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
    - name: shellcheck
      image: koalaman/shellcheck:stable
      command: ["sleep", "43200"]
      tty: true
      resources:
        requests: { cpu: "50m", memory: "64Mi" }
        limits: { cpu: "300m", memory: "256Mi" }
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
